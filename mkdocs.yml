site_name: qex
site_description: A DSL for quantitative trading signals
site_url: https://marketneutral.github.io/alpha-parser/
repo_url: https://github.com/marketneutral/alpha-parser
repo_name: marketneutral/alpha-parser

theme:
  name: material
  palette:
    # Dark mode only - hacker aesthetic
    scheme: slate
    primary: black
    accent: green
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

hooks:
  - docs/hooks/toy.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      extend_pygments_lang:
        - name: qex          # qex code blocks: highlighted with the Python lexer, written as plain qex
          lang: python
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true

validation:
  anchors: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Philosophy: philosophy.md
  - Language:
    - Syntax: language/syntax.md
    - How qex Evaluates: language/concepts.md
    - Missing Values: language/missing-values.md
    - Groups and Labels: language/groups.md
    - Universes: language/universes.md
    - Adjusted Data and Look-Ahead: language/adjusted-data.md
    - Operator Reference:
      - All Operators: language/reference.md
      - Data and Primitives: language/ops/data.md
      - Math: language/ops/math.md
      - Time Series: language/ops/time-series.md
      - Events and State: language/ops/events.md
      - Cross-Sectional: language/ops/cross-sectional.md
      - Groups: language/ops/groups.md
      - Logic and Conditions: language/ops/logic.md
      - Calendar: language/ops/calendar.md
  - Examples:
    - About the Examples: examples/index.md
    - Momentum: examples/momentum.md
    - Mean Reversion: examples/mean-reversion.md
    - Pairs Trading: examples/pairs-trading.md
    - Event-Driven: examples/event-driven.md
    - Market Beta: examples/market-beta.md
    - Technical Indicators: examples/technical-indicators.md
    - Advanced Patterns: examples/advanced-patterns.md
  - Python:
    - Installation: python/installation.md
    - Parsing: python/parsing.md
    - Signals: python/signal.md
    - Books: python/books.md
    - Evaluation: python/evaluation.md
    - Universes: python/universes.md
    - Diagnostics: python/diagnostics.md
    - Risk Model: python/risk-model.md
    - Graphs and Dask: python/distributed.md
    - API Reference: python/api.md
  - Data:
    - Data Format: data/format.md
    - Labels and Groups: data/labels.md
    - The Universe Field: data/universe.md
    - Event Data: data/events.md
    - Large Datasets: data/lazy.md
    - Adjusted and As-Traded Prices: data/adjusted.md
    - Halts, Delistings and Gaps: data/gaps.md
    - Getting Data: data/getting-data.md
  - Python Examples:
    - Quick Start: python-examples/quickstart.md
    - Backtesting: python-examples/backtesting.md
    - Backtesting the Examples: python-examples/example-backtests.md
    - Checking a Book's Beta: python-examples/beta-check.md
    - Example Scripts: python-examples/scripts.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marketneutral/alpha-parser
